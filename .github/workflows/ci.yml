name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Generate, build bronze -> silver -> gold, answer key, docs gate, TMDL export, agent eval (replayed
      # model responses re-executed against this build), ML, injected defects. Any miss fails the PR.
      - run: python run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            powerbi/
