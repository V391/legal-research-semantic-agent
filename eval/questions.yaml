  spec: {measures: [churned_arr_at_renewal], period: {start: "2025-01-01", end: "2025-12-31"}}
- id: q39
  question: How much ARR was up for renewal in Q1 2025?
  spec: {measures: [arr_up_for_renewal], period: {start: "2025-01-01", end: "2025-03-31"}}
- id: q40
  question: How much practice area ARR did Intellectual Property account for in India at the end of June 2025?
  spec: {measures: [arr], filters: {practice_area: [Intellectual Property], country: [India]}, as_of: "2025-06-30"}
